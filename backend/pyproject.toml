[project]
name = "gongxu-zhichuan"
version = "0.1.0"
description = "工序智传：教学视频 SOP 生成与技能自动考评平台"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Gongxu Zhichuan Team" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<25.0",
    "cryptography>=49.0,<51.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "httpx>=0.28,<1.0",
    "numpy>=2.0,<3.0",
    "onnxruntime>=1.20,<2.0",
    "pillow>=12.3.0",
    "mediapipe>=0.10.20,<0.11",
]

[project.optional-dependencies]
teaching = ["faster-whisper>=1.1,<2.0"]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "bandit>=1.8,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]
data = [
    "huggingface_hub>=0.26,<2",
    "remotezip>=0.12,<1",
]
media = [
    "imageio-ffmpeg>=0.6.0",
    "pdfplumber>=0.11,<1.0",
    "python-docx>=1.1,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gongxu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "migrations/versions",
    "tests/test_assembly101.py",
    "tests/test_card.py",
    "tests/test_data.py",
    "tests/test_data_audit.py",
    "tests/test_data_prepare.py",
    "tests/test_impact_adapter.py",
    "tests/test_industreal.py",
    "tests/test_industreal_adapter.py",
    "tests/test_industreal_benchmark.py",
    "tests/test_trials.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S"]
# B008: FastAPI 的 Depends() 在参数默认值是标准用法
# S105/S106/S107: 密码类误报，由 bandit（含语义上下文）负责
ignore = ["S101", "B008", "S105", "S106", "S107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "gongxu.data.industreal_adapter"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["gongxu"]
omit = ["*/alembic/*"]

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]

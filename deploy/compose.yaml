services:
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: ${GONGXU_ENV_FILE:-.env}
    environment:
      GONGXU_VISION_BACKEND: qwen
    command: >
      sh -c "python -m gongxu.db.migrate &&
      uvicorn gongxu.main:app --host 0.0.0.0 --port 8011"
    volumes:
      - ${GONGXU_HOST_DATA_DIR:-./runtime-data}:/app/data
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: ${GONGXU_ENV_FILE:-.env}
    environment:
      GONGXU_VISION_BACKEND: qwen
    command: python -m gongxu.worker
    volumes:
      - ${GONGXU_HOST_DATA_DIR:-./runtime-data}:/app/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "${GONGXU_HTTP_BIND:-0.0.0.0}:${GONGXU_HTTP_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
